services:
  - type: web
    name: wikibot-pipecat
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: singapore
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.0-flash-001
    healthCheckPath: /status
