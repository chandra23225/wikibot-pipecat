services:
  - type: web
    name: wikibot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv pip install --system "pipecat-ai[daily,google,kokoro,runner,silero,whisper]>=1.12.0" "wikipedia-api>=0.16.0" "python-dotenv"
    startCommand: python server/bot.py -t daily --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.0-flash-001
    healthCheckPath: /status
